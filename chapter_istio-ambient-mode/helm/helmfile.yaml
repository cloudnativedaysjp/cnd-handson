repositories:
- name: istio-official
  url: https://blob.istio.io/istio-release/charts
- name: kiali
  url: https://kiali.org/helm-charts
- name: prometheus-community
  url: https://prometheus-community.github.io/helm-charts

releases:
- name: istio-base
  namespace: istio-system
  createNamespace: true
  chart: istio-official/base
  version: 1.31.4
- name: istiod
  chart: istio-official/istiod
  needs:
  - istio-system/istio-base
  version: 1.31.4
  namespace: istio-system
  createNamespace: true
  wait: true
  values:
  - values/istiod.values.yaml
- name: istio-ztunnel
  namespace: istio-system
  chart: istio-official/ztunnel
  version: 1.31.4
  wait: true
  needs:
  - istio-system/istio-cni
  values:
  - values/ztunnel.values.yaml
- name: istio-cni
  namespace: istio-system
  chart: istio-official/cni
  version: 1.31.4
  wait: true
  needs:
  - istio-system/istiod
  values:
  - values/istio-cni.values.yaml
- name: kube-prometheus-stack
  namespace: prometheus
  createNamespace: true
  chart: prometheus-community/kube-prometheus-stack
  version: 93.1.0
  wait: true
  values:
  - values/prometheus-stack.values.yaml
- name: kiali-server
  namespace: istio-system
  createNamespace: true
  chart: kiali/kiali-server
  version: 2.34.1
  wait: true
  needs:
  - prometheus/kube-prometheus-stack
  values:
  - values/kiali.values.yaml
