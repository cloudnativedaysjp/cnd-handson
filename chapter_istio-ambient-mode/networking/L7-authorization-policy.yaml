---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: layer7-authz
  labels:
    content: layer7-authz
spec:
  targetRefs:
  - kind: Service
    group: ""
    name: handson
  action: DENY
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/default/sa/curl
    to:
    - operation:
        notMethods:
        - GET
        ports:
        - "8080"
