apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: handson
  labels:
    app: handson
spec:
  replicas: 10
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: handson
  template:
    metadata:
      labels:
        app: handson
    spec:
      containers:
      - name: handson
        image: argoproj/rollouts-demo:blue
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: 32Mi
            cpu: 5m
  strategy:
    canary:
      stableService: handson
      canaryService: handson-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: app-httproute
            namespace: prometheus-analysis
      steps:
      - setWeight: 20
      # Analysis が成功するまで次に進まない。失敗したら中止して元のバージョンに戻す
      - analysis:
          templates:
          - templateName: handson-analysis
          args:
          - name: envoy-cluster
            value: httproute/prometheus-analysis/app-httproute/rule/0
      - setWeight: 50
      - pause:
          duration: 30s
