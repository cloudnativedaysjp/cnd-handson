# Default values for pyroscope.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

architecture:
  storage:
    v1: false
    v2: true
  microservices:
    enabled: true

pyroscope:
  structuredConfig:
    storage:
      backend: s3
      s3:
        endpoint: pyroscope-seaweedfs-all-in-one.monitoring.svc.cluster.local:8333
        bucket_name: pyroscope
        access_key_id: pyroscope
        secret_access_key: pyroscope-handson-secret
        insecure: true
        bucket_lookup_type: path-style
  components:
    query-backend:
      kind: Deployment
      replicaCount: 3
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 128Mi
          cpu: 500m
    query-frontend:
      kind: Deployment
      replicaCount: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 128Mi
          cpu: 100m
    distributor:
      kind: Deployment
      replicaCount: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 128Mi
          cpu: 500m
    segment-writer:
      kind: StatefulSet
      replicaCount: 2
      terminationGracePeriodSeconds: 600
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 512Mi
          cpu: 500m
    compaction-worker:
      kind: StatefulSet
      replicaCount: 2
      terminationGracePeriodSeconds: 1200
      persistence:
        enabled: false
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 512Mi
          cpu: 500m
    metastore:
      kind: StatefulSet
      replicaCount: 1
      terminationGracePeriodSeconds: 1200
      persistence:
        enabled: true
        size: 1Gi
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 512Mi
          cpu: 500m
      extraArgs:
        metastore.raft.bootstrap-expect-peers: "1"
    tenant-settings:
      replicaCount: 0
    ad-hoc-profiles:
      replicaCount: 0

minio:
  enabled: false
