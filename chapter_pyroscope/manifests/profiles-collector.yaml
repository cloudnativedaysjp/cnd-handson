apiVersion: v1
kind: ServiceAccount
metadata:
  name: profiles-collector
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: handson-profiles-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: handson-profiles-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: handson-profiles-collector
subjects:
  - kind: ServiceAccount
    name: profiles-collector
    namespace: monitoring
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: profiles-collector
  namespace: monitoring
spec:
  mode: daemonset
  # 通常のcontrib版にはprofiling Receiverが含まれないため、専用の配布物を指定する。
  image: otel/opentelemetry-collector-ebpf-profiler:0.163.2
  serviceAccount: profiles-collector
  hostPID: true
  securityContext:
    runAsUser: 0
    privileged: true
  args:
    feature-gates: service.profilesSupport
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  volumeMounts:
    - name: proc
      mountPath: /proc
      readOnly: true
    - name: sys-kernel
      mountPath: /sys/kernel
      readOnly: true
    - name: cgroup
      mountPath: /sys/fs/cgroup
      readOnly: true
  volumes:
    - name: proc
      hostPath:
        path: /proc
        type: Directory
    - name: sys-kernel
      hostPath:
        path: /sys/kernel
        type: Directory
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
        type: Directory
  config:
    receivers:
      profiling:
        samples_per_second: 97
        # kindのノードコンテナとPodの入れ子PID namespaceを変換する。
        pid_namespace_translation_mode: auto
    processors:
      k8s_attributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: container.id
      transform/service-name:
        error_mode: ignore
        profile_statements:
          - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"] != nil
          - set(resource.attributes["service.name"], resource.attributes["process.executable.name"]) where resource.attributes["service.name"] == nil and resource.attributes["process.executable.name"] != nil
    exporters:
      otlp_grpc/pyroscope:
        endpoint: pyroscope-distributor.monitoring.svc.cluster.local:4040
        tls:
          insecure: true
    service:
      pipelines:
        profiles:
          receivers: [profiling]
          processors: [k8s_attributes, transform/service-name]
          exporters: [otlp_grpc/pyroscope]
