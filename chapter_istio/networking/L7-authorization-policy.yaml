---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: layer7-authz
  namespace: handson
  labels:
    content: layer7-authz
spec:
  selector:
    matchLabels:
      app: handson
  action: DENY
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/handson/sa/curl
    to:
    - operation:
        notMethods:
        - GET
        ports:
        - "8080"
