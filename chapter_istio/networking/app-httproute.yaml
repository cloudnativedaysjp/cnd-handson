# cluster-createで作成したHTTPRouteを更新し、共通の入口からIstioへ転送する。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: handson
  namespace: handson
spec:
  parentRefs:
  - name: handson-gateway
    namespace: gateway
    sectionName: http
  hostnames:
  - app.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: istio-ingressgateway
      namespace: istio-system
      port: 18080
---
# HTTPRouteから別namespaceのServiceへの参照を、宛先側で許可する。
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: handson-to-istio-ingressgateway
  namespace: istio-system
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: handson
  to:
  - group: ""
    kind: Service
    name: istio-ingressgateway
