name: istio-ingressgateway
imagePullPolicy: IfNotPresent
autoscaling:
  enabled: false
labels:
  app.kubernetes.io/part-of: istio
resources:
  limits:
    cpu: 100m
    memory: 128Mi
service:
  type: ClusterIP
  ports:
    # クラスター外からは共通のEnvoy Gateway経由でアクセスする。
  - port: 18080
    targetPort: 18080
    name: http-app
    protocol: TCP
  - port: 18443
    targetPort: 18443
    name: https
    protocol: TCP
