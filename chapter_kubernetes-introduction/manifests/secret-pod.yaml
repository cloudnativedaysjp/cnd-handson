apiVersion: v1
kind: Pod
metadata:
  labels:
    app: secret-pod
  name: secret-pod
spec:
  containers:
  - name: nginx
    image: nginx:latest
    env:
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: handson-secret
          key: username
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: handson-secret
          key: password